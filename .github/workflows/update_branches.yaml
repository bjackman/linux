name: Update kernel branches

on:
  schedule:
    - cron: "0 0 * * *" # Nightly
  workflow_dispatch: # Allows manual triggering


jobs:
  update-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update branches
        run: .github/scripts/update_branches.sh

          # Using the Github mirror is probably more efficient
          git remote add linus https://github.com/torvalds/linux.git
          git remote add akpm-mm https://git.kernel.org/pub/scm/linux/kernel/git/akpm/mm.git
          git fetch

      - name: Merge linus/master
        run: |
          git checkout github/linus/master
          git merge linus/master --no-edit

      - name: Merge mm-stable
        run: |
          git checkout github/akpm-mm/mm-stable
          git merge linus/master --no-edit

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge GitHub Actions config
        run: |
          git merge --no-edit origin/github-base

      - name: Push
        run: |
          git push
