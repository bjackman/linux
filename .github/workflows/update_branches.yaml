name: Update kernel branches

on:
  # Disabled, see README
  # schedule:
  #   - cron: "0 0 * * *" # Nightly
  workflow_dispatch: # Allows manual triggering


jobs:
  update-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Set week key
        id: week
        run: echo "week=$(date +'%Y-%W')" >> $GITHUB_OUTPUT

      - name: Restore Git bundle cache (weekly)
        id: restore-bundle
        uses: actions/cache@v3
        with:
          path: /tmp/bundle-cache
          key: cdn-bundle-${{ steps.week.outputs.week }}

      # We need the full git history, since we're gonna be doing merges.
      # GitHub does not optimise this case at all, so try using the LF's CDN
      # bundle to speed things up.
      # https://www.kernel.org/best-way-to-do-linux-clones-for-your-ci.html
      - name: Download Git bundle if not cached
        if: steps.restore-bundle.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/bundle-cache
          CDNBUNDLE="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/clone.bundle"
          curl -L "${CDNBUNDLE}" -o /tmp/bundle-cache/clone.bundle

      - name: Seed repository from Git bundle
        run: git clone /tmp/bundle-cache/clone.bundle "$GITHUB_WORKSPACE"

      # Can't use actions/checkout for this because it deletes the seeded repo
      # from above.
      - name: Checkout the code
        run: |
          # Replace the bundle with the actual repository remote.
          git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update branches
        run: .github/scripts/update_branches.sh