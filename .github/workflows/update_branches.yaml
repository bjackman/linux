name: Update kernel branches

on:
  schedule:
    - cron: "0 0 * * *" # Nightly
  workflow_dispatch: # Allows manual triggering


jobs:
  update-branches:
    runs-on: ubuntu-latest

    steps:
      # https://www.kernel.org/best-way-to-do-linux-clones-for-your-ci.html
      - name: Seed repository from Git bundle
        run: |
          set -eux

          # Distilled from
          # https://web.git.kernel.org/pub/scm/linux/kernel/git/mricon/korg-helpers.git/plain/linux-bundle-clone
          CDNBUNDLE="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/clone.bundle"
          BUNDLELOCAL=$(mktemp /tmp/linux-bundle.XXXXXXXXXX)
          curl -L "${CDNBUNDLE}" -o "${BUNDLELOCAL}"
          git clone "${BUNDLELOCAL}" "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Normally pushing to a branch from an Action doesn't trigger push
          # actions.  According to ChatGPT, using a "personal access PAT token"
          # will change that, so these pushes should trigger the test actions.
          # I created the PAT through the UI and then copied it into the
          # "repository secrets" in the UI.
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update branches
        run: .github/scripts/update_branches.sh